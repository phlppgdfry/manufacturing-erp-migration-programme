name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model, documents and site agree
        run: python3 scripts/build.py --check
      - name: Tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Links
        run: python3 scripts/check-links.py
